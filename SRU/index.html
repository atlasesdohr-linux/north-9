<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Glacier Run</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 30 16 16 30 2 16z' fill='%235eead4'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#070b14; --line:#1c2942; --txt:#e7eefc; --dim:#7d8ea8;
    --acc:#5eead4; --panel:#0e1626;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--txt); overflow:hidden;
    font:500 14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  body::before{
    content:""; position:fixed; inset:-25%; z-index:0; pointer-events:none;
    background:
      radial-gradient(45% 40% at 18% 8%, #0f2036 0%, transparent 70%),
      radial-gradient(40% 38% at 88% 92%, #0c2c2a 0%, transparent 70%);
  }
  .shell{
    position:relative; z-index:1; display:flex; flex-direction:column;
    width:min(1120px,100%); height:min(720px,100%);
    background:linear-gradient(180deg,var(--panel),#080f1a);
    border:1px solid var(--line); border-radius:16px; overflow:hidden;
    box-shadow:0 40px 90px -30px #000, inset 0 0 0 1px #ffffff08;
  }
  .bar{
    display:flex; align-items:center; gap:10px; flex:none;
    padding:10px 14px; border-bottom:1px solid var(--line);
    background:#0b1322cc; backdrop-filter:blur(10px);
  }
  .dot{
    width:8px; height:8px; border-radius:50%; background:var(--acc);
    box-shadow:0 0 14px var(--acc); flex:none;
  }
  .bar h1{
    margin:0; font-size:12.5px; font-weight:800; letter-spacing:1.4px;
    text-transform:uppercase; color:#cfe4ff; white-space:nowrap;
  }
  .hint{margin-left:4px; font-size:12px; color:var(--dim); white-space:nowrap}
  .hint b{color:#9fb4d0; font-weight:700}
  .spacer{flex:1}
  .btn{
    display:grid; place-items:center; width:32px; height:32px; flex:none;
    border:1px solid var(--line); border-radius:8px; background:#101c2e;
    color:#a9c0dc; cursor:pointer; transition:.15s;
  }
  .btn:hover{background:#16273e; color:#e7eefc; border-color:#2a3d5c}
  .btn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2}
  .stage{position:relative; flex:1; background:#04070d}
  canvas{display:block; width:100%; height:100%}
  .load{
    position:absolute; inset:0; display:grid; place-items:center;
    background:radial-gradient(circle at 50% 45%,#0b1524,#04070d 72%);
    transition:opacity .4s ease;
  }
  .load.hide{opacity:0; pointer-events:none}
  .inner{display:flex; flex-direction:column; align-items:center; gap:14px; padding:20px; text-align:center}
  .ring{
    width:54px; height:54px; border-radius:50%;
    background:conic-gradient(var(--acc) calc(var(--p,0)*1%), #16233a 0);
    mask:radial-gradient(circle,transparent 20px,#000 21px);
    -webkit-mask:radial-gradient(circle,transparent 20px,#000 21px);
    transition:background .2s;
  }
  .pct{font-size:12px; letter-spacing:2px; color:var(--dim); font-variant-numeric:tabular-nums}
  .msg{font-size:13px; color:#8ea4bf; max-width:36ch}
  .msg.err{color:#fca5a5}
  .shell:fullscreen{width:100%; height:100%; border:0; border-radius:0}
  @media(max-width:640px){
    body{padding:0}
    .shell{height:100%; border:0; border-radius:0}
    .hint{display:none}
  }
  @media(prefers-reduced-motion:reduce){ .ring{animation:none} }
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="bar">
    <span class="dot"></span>
    <h1>Glacier Run</h1>
    <span class="hint"><b>&larr; &rarr;</b> steer &middot; <b>space</b> jump</span>
    <span class="spacer"></span>
    <button class="btn" id="fs" title="Fullscreen (F)" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="load" id="load">
      <div class="inner">
        <div class="ring" id="ring"></div>
        <div class="pct" id="pct">0%</div>
        <div class="msg" id="msg">Loading</div>
      </div>
    </div>
  </div>
</div>

<script>
</body>
</html>
