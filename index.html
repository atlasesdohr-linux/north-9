<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111318">

    <title>Document</title>

    <!-- Simple invisible favicon to stop 404 -->
    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #111318;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            padding: 24px;
        }

        .page {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .brand span {
            color: #83cfff;
        }

        .game-label {
            color: #aab2c0;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .game-panel {
            position: relative;
            width: 100%;
            height: min(78vh, 850px);
            min-height: 420px;
            overflow: hidden;
            background: #231F20;
            border: 1px solid #303642;
            border-radius: 12px;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            margin: 0 auto;
        }

        #gameContainer canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        .loading-screen {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #171a20;
            transition: opacity 0.35s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-ring {
            width: 82px;
            height: 82px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background:
                conic-gradient(
                    #83cfff var(--progress, 0%),
                    #303642 0
                );
            margin-bottom: 22px;
        }

        .loader-inner {
            width: 68px;
            height: 68px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #171a20;
            font-size: 17px;
            font-weight: bold;
        }

        #msg {
            color: #d5dce7;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 16px;
        }

        .status {
            color: #8f9aaa;
            font-size: 13px;
        }

        .fullscreen-button {
            border: 1px solid #3b4655;
            background: #202630;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .fullscreen-button:hover {
            background: #303b4b;
        }

        @media (max-width: 650px) {
            body {
                padding: 12px;
            }

            .game-panel {
                height: 70vh;
                min-height: 350px;
            }

            .brand {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <header class="topbar">
            <div class="brand">SR<span>U</span></div>
            <div class="game-label">SRU</div>
        </header>

        <section class="game-panel">

            <div id="gameContainer"></div>

            <div class="loading-screen" id="load">
                <div class="loader-ring" id="ring">
                    <div class="loader-inner" id="pct">0%</div>
                </div>

                <div id="msg">Loading...</div>
            </div>

        </section>

        <footer class="bottom-bar">
            <div class="status" id="status">
                Preparing...
            </div>

            <button
                class="fullscreen-button"
                id="fullscreenButton"
                type="button"
            >
                FULLSCREEN
            </button>
        </footer>

    </main>

    <script>
        // Keep the existing optional Firebase event hook.
        window.firebaseLogEvent = function(event) {
            console.log("Firebase event skipped:", event);
        };

        // Block Unity / GameDistribution telemetry (schools can detect these calls)
        const _fetch = window.fetch;
        window.fetch = function(url, opts) {
            const u = (typeof url === 'string' ? url : (url && url.url) || '').toString();
            if (/unity3d\.com|gamedistribution\.com|uca\.cloud|cdp\.cloud/i.test(u)) {
                return Promise.resolve(new Response('{}', { status: 200 }));
            }
            return _fetch.apply(this, arguments);
        };

        const loadingScreen = document.getElementById("load");
        const progressRing = document.getElementById("ring");
        const percentageText = document.getElementById("pct");
        const messageText = document.getElementById("msg");
        const statusText = document.getElementById("status");
        const fullscreenButton = document.getElementById("fullscreenButton");

        let gameInstance = null;

        function updateProgress(instance, progress) {
            const percent = Math.round(progress * 100);

            percentageText.textContent = percent + "%";
            progressRing.style.setProperty("--progress", percent + "%");

            if (percent < 100) {
                statusText.textContent = "Loading... " + percent + "%";
            }
        }

        function finishLoading() {
            percentageText.textContent = "100%";
            progressRing.style.setProperty("--progress", "100%");
            messageText.textContent = "Ready!";
            statusText.textContent = "Loaded";

            setTimeout(function() {
                loadingScreen.classList.add("hidden");
            }, 400);
        }

        function showError(error) {
            console.error("Loading error:", error);
            messageText.textContent = "Unable to load.";
            statusText.textContent = "Check the browser console for errors.";
        }

        fullscreenButton.addEventListener("click", function() {
            if (gameInstance && gameInstance.SetFullscreen) {
                gameInstance.SetFullscreen(1);
            }
        });

        // Load the Unity WebGL loader
        const loaderScript = document.createElement("script");

        loaderScript.src = "assets/loader.js";

        loaderScript.onload = function() {
            try {
                gameInstance = UnityLoader.instantiate(
                    "gameContainer",
                    "assets/build.json",
                    {
                        onProgress: updateProgress,

                        Module: {
                            onRuntimeInitialized: function() {
                                finishLoading();
                            }
                        }
                    }
                );

                window.unityInstance = gameInstance;

            } catch (error) {
                showError(error);
            }
        };

        loaderScript.onerror = function() {
            showError("loader.js could not be loaded.");
        };

        document.body.appendChild(loaderScript);
    </script>
</body>
</html>
